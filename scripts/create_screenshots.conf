# tests/functional/app.conf, even though both point at the same app/image:
# that conf's GOLDEN_DIR default makes run_sequence.sh auto-attempt a golden
# comparison even without an explicit --golden-dir flag (see
# tests/functional_framework/run_sequence.sh's GOLDEN_DIR_FROM_CONF), which
# doesn't apply here - these are illustrative README screenshots, not a
# regression baseline. See tests/functional_framework/README.md for the
# format.

